<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ParqueaHuila</title>
<style>
  :root { --verde:#0f766e; --gris:#f1f5f9; --borde:#cbd5e1; --texto:#0f172a; --rojo:#b91c1c; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, Segoe UI, sans-serif; background:var(--gris); color:var(--texto); }
  header { background:var(--verde); color:#fff; padding:18px 24px; }
  header h1 { margin:0; font-size:1.6rem; }
  header small { opacity:.85; }
  main { max-width:960px; margin:0 auto; padding:20px 16px; display:grid; gap:16px; grid-template-columns:1fr 1fr; }
  section { background:#fff; border:1px solid var(--borde); border-radius:10px; padding:16px; }
  .ancho { grid-column: 1 / -1; }
  h2 { margin:0 0 12px; font-size:1.1rem; }
  label { display:block; font-size:.85rem; margin:8px 0 4px; }
  input, select, button { font:inherit; padding:8px 10px; border:1px solid var(--borde); border-radius:6px; width:100%; }
  button { background:var(--verde); color:#fff; border:none; margin-top:12px; cursor:pointer; font-weight:600; }
  .cupos { display:flex; gap:12px; }
  .cupo { flex:1; text-align:center; background:var(--gris); border-radius:8px; padding:10px; }
  .cupo b { display:block; font-size:2rem; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--borde); }
  #mensaje { min-height:1.4em; font-weight:600; }
  .error { color:var(--rojo); }
  @media (max-width:640px) { main { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>ParqueaHuila</h1>
  <small>Parqueadero del centro · Neiva · versión <span id="version">…</span></small>
</header>
<main>
  <section class="ancho">
    <h2>Cupos libres</h2>
    <div class="cupos">
      <div class="cupo">Carros<b id="libres-carro">–</b><span id="tarifa-carro"></span></div>
      <div class="cupo">Motos<b id="libres-moto">–</b><span id="tarifa-moto"></span></div>
      <div class="cupo">Recaudo de hoy<b id="recaudo">–</b></div>
    </div>
  </section>

  <section>
    <h2>Registrar entrada</h2>
    <form id="form-entrada">
      <label for="placa-entrada">Placa</label>
      <input id="placa-entrada" placeholder="ABC123" required>
      <label for="tipo">Tipo</label>
      <select id="tipo"><option value="carro">Carro</option><option value="moto">Moto</option></select>
      <button>Entrar</button>
    </form>
  </section>

  <section>
    <h2>Registrar salida</h2>
    <form id="form-salida">
      <label for="placa-salida">Placa</label>
      <input id="placa-salida" placeholder="ABC123" required>
      <button>Cobrar y salir</button>
    </form>
    <p id="mensaje"></p>
  </section>

  <section class="ancho">
    <h2>Vehículos adentro</h2>
    <table>
      <thead><tr><th>Placa</th><th>Tipo</th><th>Entró</th></tr></thead>
      <tbody id="adentro"></tbody>
    </table>
  </section>
</main>
<script>
  // La API está en el mismo servidor: rutas relativas, nada de "localhost" quemado.
  const pesos = (n) => '$' + n.toLocaleString('es-CO');
  const $ = (id) => document.getElementById(id);

  function mostrar(texto, esError) {
    $('mensaje').textContent = texto;
    $('mensaje').className = esError ? 'error' : '';
  }

  async function api(metodo, ruta, cuerpo) {
    const r = await fetch(ruta, { method: metodo, headers: { 'Content-Type': 'application/json' },
                                  body: cuerpo ? JSON.stringify(cuerpo) : undefined });
    const datos = await r.json();
    if (!r.ok) throw new Error(datos.error);
    return datos;
  }

  async function refrescar() {
    const p = await api('GET', '/api/parqueadero');
    $('libres-carro').textContent = p.libres.carro;
    $('libres-moto').textContent = p.libres.moto;
    $('tarifa-carro').textContent = pesos(p.tarifas.carro) + ' / hora';
    $('tarifa-moto').textContent = pesos(p.tarifas.moto) + ' / hora';
    $('recaudo').textContent = pesos(p.recaudoHoy);
    const filas = p.adentro.map((v) => {
      const tr = document.createElement('tr');
      for (const t of [v.placa, v.tipo, new Date(v.entrada).toLocaleTimeString('es-CO')]) {
        const td = document.createElement('td'); td.textContent = t; tr.append(td);   // textContent: sin inyección de HTML
      }
      return tr;
    });
    $('adentro').replaceChildren(...filas);
  }

  $('form-entrada').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      const r = await api('POST', '/api/entradas', { placa: $('placa-entrada').value, tipo: $('tipo').value });
      mostrar(`Entró ${r.placa}`); $('placa-entrada').value = '';
    } catch (err) { mostrar(err.message, true); }
    refrescar();
  });

  $('form-salida').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      const r = await api('POST', '/api/salidas', { placa: $('placa-salida').value });
      mostrar(`${r.placa}: ${r.minutos} min → ${r.horas} h → paga ${pesos(r.valor)}`); $('placa-salida').value = '';
    } catch (err) { mostrar(err.message, true); }
    refrescar();
  });

  api('GET', '/api/status').then((s) => { $('version').textContent = s.version.slice(0, 7); });
  refrescar();
</script>
</body>
</html>
